<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <br><br><br><br><br><br><br>
    <div id="data">
        <p id="score0">Score: </p>
        <p id="score">0</p>
        <p id="timer0">Timer: </p>
        <p id="timer">10</p>
    </div>
    <br>
    <div id="questionCard">
        <h2 id="question">In the sci-fi novel Project Hail Mary, the alien character Rocky communicates using musical chords</h2>
        <h2 id="endScore"></h2>
        <h2 id="correctAns"></h2>
    </div>
    <br><br>
    <div id="answrs">
        <button id="tru" onclick="trueAns()">True</button>
        <button id="fals" onclick="falseAns()">False</button>
    </div>
    <br>
    <script src="script.js"></script>
</body>
</html>
